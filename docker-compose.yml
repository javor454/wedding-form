services:
  vercel:
    build: .
    volumes:
      - .:/app
    env_file: .env
    stdin_open: true
    tty: true

  # Development server
  dev:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - wiremock

  # Mock API server
  wiremock:
    image: wiremock/wiremock:latest
    ports:
      - "8080:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command: ["--verbose"]